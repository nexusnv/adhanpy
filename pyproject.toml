[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov=adhanpy --cov-branch"
testpaths = "tests"

[tool.mypy]
show_error_codes = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]